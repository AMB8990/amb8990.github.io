<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安泊塔羅 | AI線上占卜</title>
    <style>
        :root {
            --primary-color: #ffd700;
            --bg-color: #773d1c;
            --card-back: linear-gradient(135deg, #b86c16, #faae7b);
            --text-color: #fff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
            margin-top: 20px;
        }

        button:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* --- 模式選擇 --- */
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin: 20px 0;
        }

        .mode-option {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .mode-option:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .mode-option.selected {
            border-color: var(--primary-color);
            background: rgba(255, 215, 0, 0.15);
        }

        .mode-option input {
            margin-right: 15px;
            accent-color: var(--primary-color);
            scale: 1.2;
        }

        .mode-description {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        section {
            display: none;
            width: 100%;
            max-width: 600px;
            /* For phone */
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 1s ease-in-out;
            flex-grow: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #intro-screen {
            text-align: center;
            padding-top: 10vh;
        }

        .mystic-circle {
            width: 120px;
            height: 120px;
            border: 2px dashed var(--primary-color);
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .name-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--primary-color);
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            padding: 10px;
            width: 200px;
            outline: none;
            margin-bottom: 10px;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .deck-container {
            position: relative;
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-placeholder {
            width: 100px;
            height: 160px;
            background: var(--card-back);
            border-radius: 8px;
            position: absolute;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .spread-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .tarot-card {
            background-color: transparent;
            width: 120px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .tarot-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .card-back {
            background: var(--card-back);
        }

        .card-front {
            background-color: #2a1b3d;
            border: 1px solid var(--primary-color);
            transform: rotateY(180deg);
            padding: 5px;
            box-sizing: border-box;
        }

        .card-image {
            font-size: 2.5rem;
            margin: 10px 0;
        }

        .meaning-box {
            background: rgba(255, 255, 255, 0.1);
            margin-top: 5px;
            padding: 0 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out, padding 0.5s;
            border-radius: 5px;
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: justify;
        }

        .tarot-card.flipped+.meaning-box {
            max-height: 300px;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .rating-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin: 20px 0;
        }

        .rating-option {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .rating-option:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .rating-option input {
            margin-right: 10px;
            accent-color: var(--primary-color);
        }

        .language-switcher {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin: 0 0 12px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
        }

        .language-switcher select {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: rgba(17, 15, 31, 0.8);
            color: #fff;
            outline: none;
        }

        textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.925);
            border: 1px solid #f0cca3;
            color: #201616;
            border-radius: 5px;
            box-sizing: border-box;
            height: 80px;
            resize: none;
            margin-top: 10px;
        }

        /* AI 聊天樣式 */
        .ai-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .user-message {
            background: linear-gradient(135deg, #daaf78, #ebb239);
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .ai-message.assistant {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .ai-message.thinking {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
            font-style: italic;
        }

        #ai-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #ai-send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 171, 45, 0.3);
        }
    </style>
</head>

<body>
    <div class="language-switcher">
        <label for="language-select" style="opacity:0.8;">Language</label>
        <select id="language-select" aria-label="Select language">
            <option value="zh-tw">繁體中文</option>
            <option value="english">English</option>
            <option value="japanese">日本語</option>
        </select>
    </div>
    <!-- <p style="font-size: 0.9rem; opacity: 0.8; color: rgba(255,255,255,0.35);">版本: 1.0.2 - fixed 過期的key </p> -->
    <p style="font-size: 0.9rem; opacity: 0.8; color: rgba(255,255,255,0.35);">版本: 1.1.0 - Add Language Switching and Fixed AI chat</p>

    <section id="intro-screen" class="active">
        <div class="mystic-circle"></div>
        <h1 data-i18n="intro.title">安泊的AI線上塔羅</h1>
        <div style="margin: 30px 0;">
            <input type="text" id="nickname" class="name-input" data-i18n-placeholder="intro.nicknamePlaceholder" placeholder="朋朋 你的暱稱" maxlength="10">
        </div>

        <p style="font-size: 0.9rem; opacity: 0.8;" data-i18n="intro.tagline">來都來了，不算一下嗎</p>
        <button onclick="goToModeSelection()" data-i18n="intro.startButton">開始</button>
    </section>

    <section id="mode-screen">
        <div class="mystic-circle" style="width: 80px; height: 80px; margin-bottom: 20px;"></div>
        <h2 id="mode-greeting"></h2>

        <div class="mode-selection">
            <h3 style="margin: 10px 0; font-size: 1.1rem;" data-i18n="mode.instructions">選好後開始在心中默念你的問題...</h3>
            <label class="mode-option" onclick="selectMode(this, 'single')">
                <input type="radio" name="mode" value="single" checked>
                <div>
                    <div><strong data-i18n="mode.singleTitle">單張模式 🃏</strong></div>
                    <div class="mode-description" data-i18n="mode.singleDescription">安泊建議: <br>問 Yes/No 類型的問題適合，一針濺血。</div>
                </div>
            </label>
            <label class="mode-option" onclick="selectMode(this, 'three')">
                <input type="radio" name="mode" value="three">
                <div>
                    <div><strong data-i18n="mode.threeTitle">三張模式 🃏🃏🃏</strong></div>
                    <div class="mode-description" data-i18n="mode.threeDescription">安泊建議: <br>抽出|過去|現在|未來|，以了解完整脈絡</div>
                </div>
            </label>
            <label class="mode-option" onclick="selectMode(this, 'four')">
                <input type="radio" name="mode" value="four">
                <div>
                    <div><strong data-i18n="mode.fourTitle">四張模式 🃏🃏🃏🃏</strong></div>
                    <div class="mode-description" data-i18n="mode.fourDescription">安泊建議: <br>抽出|主要狀況|障礙|建議|結果|，詳細解讀</div>
                </div>
            </label>
        </div>
        <button onclick="goToDrawing()" data-i18n="mode.startShuffle">開始洗牌</button>
    </section>

    <section id="drawing-screen">
        <h2 id="greeting-text"></h2>
        <div class="deck-container" id="deck-visual"></div>
        <button id="reveal-btn" style="opacity:0; pointer-events:none;" onclick="showResults()" data-i18n="drawing.revealResult">查看結果</button>
    </section>

    <section id="result-screen">
        <p style="font-size: 0.8rem; opacity: 0.7;" data-i18n="result.clickCard">點擊卡牌看解讀</p>

        <div class="spread-area" id="cards-container"></div>
        <button type="button" onclick="openAIChat();" style="font-size: 0.9rem; padding: 6px 16px; margin-left: 10px; background: linear-gradient(45deg, #daaf78 0%, #f5b221 100%); border: none; color: white;" data-i18n="result.askAI">可以點這裡問AI</button>

        <hr style="width: 100%; border: 0.5px solid #444; margin: 40px 0;">
    
        <div style="width: 100%;">
            <h3 data-i18n="result.feedbackTitle">給安泊一點意見</h3>
            <form id="feedback-form">
                <div class="rating-group">
                    <label class="rating-option" onclick="selectRating(this, '有準有喜歡')">
                        <input type="radio" name="rating" value="有準有喜歡" required> <span data-i18n="result.rating.good">有準有喜歡</span>
                    </label>
                    <label class="rating-option" onclick="selectRating(this, '再想想ㄟ')">
                        <input type="radio" name="rating" value="再想想ㄟ"> <span data-i18n="result.rating.thinkAgain">再想想ㄟ</span>
                    </label>
                    <label class="rating-option" onclick="selectRating(this, '多做幾版玩玩看')">
                        <input type="radio" name="rating" value="多做幾版玩玩看"> <span data-i18n="result.rating.moreVersions">多做幾版玩玩看</span>
                    </label>
                    <label class="rating-option" onclick="selectRating(this, '我不信我只是來支持安泊')">
                        <input type="radio" name="rating" value="我不信我只是來支持安泊"> <span data-i18n="result.rating.support">我不信，我只是來支持安泊</span>
                    </label>
                </div>

                <textarea name="message" data-i18n-placeholder="result.messagePlaceholder" placeholder="選填-跟安泊說的建議" onblur="submitAdditionalMessage()"></textarea>
                <div style="display: flex; align-items: center; margin-top: 10px;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                    <button type="button" onclick="submitFeedback();" style="font-size: 0.9rem; padding: 6px 24px; flex: 1; max-width: 140px;" data-i18n="result.submitFeedback">送出意見</button>
                    <span id="form-status" style="margin: 0 10px; font-size:0.85rem; color:var(--primary-color); flex: 0 0 auto;"></span>
                    <button type="button" onclick="location.reload()" style="font-size: 0.9rem; padding: 6px 24px; flex: 1; max-width: 140px;" data-i18n="result.shuffleAgain">再算一次</button>
                </div>
            </form>
        </div>
    </section>

    <!-- AI 聊天區域 -->

                <button onclick="backToResults()" style="background: transparent; border: 1px solid #666; color: #ccc; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem;" data-i18n="ai.back">返回</button>
            </div>
            <div id="ai-chat-messages" style="min-height: 300px; max-height: 400px; overflow-y: auto; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);"></div>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="ai-input" data-i18n-placeholder="ai.inputPlaceholder" placeholder="問問AI有什麼見解..." style="flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid #666; border-radius: 20px; color: white; outline: none;">
            <button id="ai-send-btn" onclick="sendToAI()" style="background: linear-gradient(45deg, #daaf78 0%, #db9a0c 100%); border: none; color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer;" data-i18n="ai.send">發送</button>

    </section>

        function selectMode(element, mode) {
            document.querySelectorAll('.mode-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            currentMode = mode;
        }

        function switchScreen(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToModeSelection() {
            const input = document.getElementById('nickname');
            if (!input.value.trim()) {
                alert(getLocalizedText('alert', 'noNickname'));
                return;
            }

            currentUser = input.value.trim();
            const welcomeText = currentLanguage === 'english'
                ? `Welcome, ${currentUser}!`
                : currentLanguage === 'japanese'
                    ? `${currentUser}さん、ようこそ！`
                    : `${currentUser}，歡迎你~ `;
            document.getElementById('mode-greeting').innerText = welcomeText;

            switchScreen('mode-screen');
        }

        async function goToDrawing() {
            const selectedMode = document.querySelector('input[name="mode"]:checked');
            if (!selectedMode) {
                alert(getLocalizedText('alert', 'noMode'));
                return;
            }

            currentMode = selectedMode.value;

            recordToSheet("start", {});

            document.getElementById('greeting-text').innerText = getLocalizedText('mode', 'greeting');

            switchScreen('drawing-screen');
            const visual = document.getElementById('deck-visual');
            visual.innerHTML = '';

            const cardCount = currentMode === 'single' ? 1 : (currentMode === 'three' ? 3 : 4);

            for (let i = 0; i < cardCount + 2; i++) {
                let card = document.createElement('div');
                card.className = 'card-placeholder';
                card.style.transform = `rotate(${Math.random() * 15 - 7.5}deg) translate(${Math.random() * 20}px, ${Math.random() * 10}px)`;
                card.style.zIndex = cardCount + 2 - i;
                visual.appendChild(card);
            }

            setTimeout(() => {
                const btn = document.getElementById('reveal-btn');
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }, 2500);
        }

        async function recordToSheet(type, data) {
            try {
                const params = new URLSearchParams();
                params.append("time", new Date().toLocaleString('zh-TW'));
                params.append("nickname", currentUser);
                params.append("mode", modeLabels[currentMode]);
                
                if (type === "start") {
                    params.append("cards", "開始占卜");
                    params.append("rating", "");
                    params.append("message", "");
                } else if (type === "cards_drawn") {
                    const cardNames = drawnCards.map(card => card.name).join(', ');
                    params.append("cards", cardNames);
                    params.append("rating", "");
                    params.append("message", "抽牌完成");
                } else if (type === "rating") {
                    const cardNames = drawnCards.map(card => card.name).join(', ');
                    params.append("cards", cardNames);
                    params.append("rating", data.rating);
                    params.append("message", "");
                } else if (type === "message") {
                    const cardNames = drawnCards.map(card => card.name).join(', ');
                    params.append("cards", cardNames);
                    params.append("rating", "");
                    params.append("message", data.message);
                } else if (type === "ai_question") {
                    const cardNames = drawnCards.map(card => card.name).join(', ');
                    params.append("cards", cardNames);
                    params.append("rating", "");
                    params.append("message", `[問AI] ${toSafeText(data.message)}`);
                } else if (type === "ai_response") {
                    const cardNames = drawnCards.map(card => card.name).join(', ');
                    params.append("cards", cardNames);
                    params.append("rating", "");
                    const providerText = data.provider ? ` / ${toSafeText(data.provider)}` : '';
                    params.append("message", `[AI回覆] ${toSafeText(data.message)}${providerText}`);
                }

                await fetch(GAS_URL + "?" + params.toString(), {
                    method: "POST",
                    mode: "no-cors"
                });

                console.log(`logToSheetOK: ${type}`, data);
            } catch (error) {
                console.error("logToSheetError:", error);
            }
        }

        async function showResults() {
            const cardCount = currentMode === 'single' ? 1 : (currentMode === 'three' ? 3 : 4);

            drawnCards = [];
            const usedIndices = new Set();

            for (let i = 0; i < cardCount; i++) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * tarotDeck.length);
                } while (usedIndices.has(randomIndex));

                usedIndices.add(randomIndex);
                drawnCards.push(tarotDeck[randomIndex]);
            }

            recordToSheet("cards_drawn", {});

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (currentMode === 'single') {
                createSingleCard(container, drawnCards[0]);
            } else {
                createMultipleCards(container, drawnCards);
            }

            switchScreen('result-screen');
        }

        function createSingleCard(container, cardData) {
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'display: flex; flex-direction: column; align-items: center; width: 120px;';

            const card = document.createElement('div');
            card.className = 'tarot-card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <div class="card-image">${cardData.image}</div>
                        <div class="card-title">${cardData.name}</div>
                    </div>
                </div>`;

            const meaning = document.createElement('div');
            meaning.className = 'meaning-box';
            meaning.innerText = cardData.mean;

            card.addEventListener('click', function () {
                this.classList.toggle('flipped');
                if (this.classList.contains('flipped')) {
                    meaning.style.maxHeight = '300px';
                    meaning.style.padding = '10px';
                    meaning.style.border = '1px solid rgba(255,215,0,0.3)';
                } else {
                    meaning.style.maxHeight = '0';
                    meaning.style.padding = '0 10px';
                    meaning.style.border = 'none';
                }
            });

            wrapper.appendChild(card);
            wrapper.appendChild(meaning);
            container.appendChild(wrapper);
        }

        function createMultipleCards(container, cardsData) {
            container.style.cssText = 'display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 500px; margin: 0 auto;';

            cardsData.forEach((cardData, index) => {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = 'display: flex; flex-direction: column; align-items: center; width: 110px; margin-bottom: 20px;';

                const positionSet = translatedCardPositions[currentLanguage]?.[currentMode] || cardPositions[currentMode];
                if (positionSet) {
                    const positionLabel = document.createElement('div');
                    positionLabel.style.cssText = 'font-size: 0.8rem; color: var(--primary-color); margin-bottom: 8px; text-align: center; font-weight: bold;';
                    positionLabel.innerText = positionSet[index];
                    wrapper.appendChild(positionLabel);
                }

                const card = document.createElement('div');
                card.className = 'tarot-card';
                card.style.width = '110px';
                card.style.height = '180px';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <div class="card-image" style="font-size: 2rem;">${cardData.image}</div>
                            <div class="card-title" style="font-size: 0.8rem;">${cardData.name}</div>
                        </div>
                    </div>`;

                const meaning = document.createElement('div');
                meaning.className = 'meaning-box';
                meaning.style.fontSize = '0.75rem';
                meaning.innerText = cardData.mean;

                card.addEventListener('click', function () {
                    this.classList.toggle('flipped');
                    if (this.classList.contains('flipped')) {
                        meaning.style.maxHeight = '200px';
                        meaning.style.padding = '8px';
                        meaning.style.border = '1px solid rgba(255,215,0,0.3)';
                    } else {
                        meaning.style.maxHeight = '0';
                        meaning.style.padding = '0 8px';
                        meaning.style.border = 'none';
                    }
                });

                wrapper.appendChild(card);
                wrapper.appendChild(meaning);
                container.appendChild(wrapper);
            });
        }

        async function selectRating(element, rating) {
            const radio = element.querySelector('input[type="radio"]');
            radio.checked = true;

            // await recordToSheet("rating", { rating: rating });

            document.getElementById('form-status').innerHTML = ``;
        }

        async function submitAdditionalMessage() {
            const textarea = document.querySelector('textarea[name="message"]');
            const message = textarea.value.trim();

            if (message) {
                await recordToSheet("message", { message: message });
                document.getElementById('form-status').innerHTML = ``;

        async function submitFeedback() {
            const textarea = document.querySelector('textarea[name="message"]');
            const message = textarea.value.trim();
            
            if (message) {
                await recordToSheet("message", { message: message });

            textarea.value = '';
            
            document.getElementById('form-status').innerHTML = `已送出`;

        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                const firstModeOption = document.querySelector('#mode-screen .mode-option');
                if (firstModeOption) {
                    firstModeOption.classList.add('selected');
                }
            }, 100);
        });

        // AI 聊天功能
        const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
         const MISTRAL_API_URL = "https://api.mistral.ai/v1/chat/completions";
        //就知道你在找什麼
        //只是免費的Key要拿就拿吧，因為安泊懶得寫後端 :DDD
        const GROQ_API_KEY = "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";
        const MISTRAL_API_KEY = "cOxEi2bMTh15YetsbIjUXBawhndKsi6T"; 
        
        const GROQ_MODELS = [
            "openai/gpt-oss-20b",
            "llama-3.1-8b-instant",
            "llama-3.3-70b-versatile",
        ]

        async function callGroqAPI(messages) {
            for (const model of GROQ_MODELS) {
                try {
                    console.log(`嘗試使用模型: ${model}`);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);
                    
                    const response = await fetch(GROQ_API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${GROQ_API_KEY}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages,
                            max_tokens: 1024,
                            temperature: 0.7
                        }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const data = await response.json();
                        console.log(`模型 ${model} 成功回應`);
                        return {
                            reply: data.choices[0].message.content,
                            provider: `Groq (${model})`
                        };
                    } else {
                        const errorText = await response.text();
                        console.log(`模型 ${model} 失敗，狀態碼: ${response.status}`);
                        console.log(`錯誤詳情: ${errorText}`);
                        continue;
                    }
                    
                } catch (error) {
                    console.log(`模型 ${model} 錯誤: ${error.message}`);
                    continue;
                }
            }
            
            throw new Error("所有 Groq 模型都無法使用");
        }

        async function callMistralAPI(messages) {
            try {
                console.log('嘗試使用 Mistral AI...');
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(MISTRAL_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${MISTRAL_API_KEY}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: "mistral-tiny",
                        messages: messages,
                        max_tokens: 1024
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    console.log('Mistral AI 成功回應');
                    return {
                        reply: data.choices[0].message.content,
                        provider: "Mistral AI"
                    };
                } else {
                    const errorText = await response.text();
                    console.log(`Mistral AI 失敗，狀態碼: ${response.status}`);
                    console.log(`錯誤詳情: ${errorText}`);
                    throw new Error(`Mistral API 錯誤: ${response.status}`);
                }
                
            } catch (error) {
                console.log(`Mistral AI 錯誤: ${error.message}`);
                throw error;
            }
        }

        async function callAI(messages) {
            // 先嘗試 Groq API
            try {
                return await callGroqAPI(messages);
            } catch (groqError) {
                console.log('所有 Groq 模型都失敗，嘗試 Mistral AI...');
                
                // 如果 Groq 失敗，嘗試 Mistral AI
                try {
                    return await callMistralAPI(messages);
                } catch (mistralError) {
                    console.log('Mistral AI 也失敗了');
                    throw new Error("所有 AI 服務都無法使用");
                }
            }
        }

        function openAIChat() {
            switchScreen('ai-chat-screen');
            
            const cardNames = drawnCards.map(card => card.name).join(', ');
            const introText = `${getLocalizedText('ai', 'intro')}${cardNames}\n\n${currentLanguage === 'english' ? 'Ask your question here.' : currentLanguage === 'japanese' ? 'ここで質問してください。' : '這邊直接請AI回答你...'}`;
            addMessageToChat('assistant', introText);
            
            console.log('Groq API Key 前10位:', GROQ_API_KEY.substring(0, 10));
            console.log('Mistral API Key 前10位:', MISTRAL_API_KEY.substring(0, 10));
            console.log('Groq API URL:', GROQ_API_URL);
            console.log('Mistral API URL:', MISTRAL_API_URL);
        }

        function backToResults() {
            switchScreen('result-screen');
        }

        function toSafeText(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'string') return value;
            if (typeof value === 'number' || typeof value === 'boolean') return String(value);
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value);
                } catch (error) {
                    return Object.prototype.toString.call(value);
                }
            }
            return String(value);
        }

        function addMessageToChat(role, message) {
            const chatContainer = document.getElementById('ai-chat-messages');
            const messageDiv = document.createElement('div');
            const safeMessage = toSafeText(message).replace(/\r?\n/g, '<br>');
            messageDiv.className = `ai-message ${role === 'user' ? 'user-message' : 'assistant'}`;
            messageDiv.innerHTML = safeMessage;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const sendBtn = document.getElementById('ai-send-btn');
            const userMessage = input.value.trim();
            
            if (!userMessage) return;
            
            addMessageToChat('user', userMessage);
            input.value = '';
            await recordToSheet("ai_question", { message: userMessage });
            
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'ai-message thinking';
            thinkingDiv.innerHTML = getLocalizedText('ai', 'thinking');
            document.getElementById('ai-chat-messages').appendChild(thinkingDiv);
            
            sendBtn.disabled = true;
            sendBtn.textContent = currentLanguage === 'english' ? 'Sending...' : currentLanguage === 'japanese' ? '送信中...' : '發送中...';
            
            try {
                const cardInfo = drawnCards.map(card => `${card.name}: ${card.mean}`).join('\n');
                const languageInstruction = getLocalizedText('ai', 'languagePrompt');
                const systemPrompt = `你是一位專業的塔羅牌解讀師。用戶剛剛完成了${modeLabels[currentMode]}的占卜，抽到的牌是：
${cardInfo}

請以溫和、智慧且具有洞察力的語調回應用戶的問題。你的回答應該：
1. 具有深度和意義，不要回太長
2. 聯繫用戶抽到的具體牌面
3. 保持神秘而不失親和力的語調
4. ${languageInstruction}`;

                const result = await callAI([
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userMessage }
                ]);
                
                await recordToSheet("ai_response", {
                    message: result?.reply || result || '',
                    provider: result?.provider || 'AI'
                });
                
                thinkingDiv.remove();
                
                const safeReply = toSafeText(result?.reply || result || '');
                const aiReply = `${safeReply}\n\n<small style="opacity: 0.6; font-size: 0.7em;">由 ${toSafeText(result?.provider || 'AI')} 提供</small>`;
                addMessageToChat('assistant', aiReply);
                
            } catch (error) {
                console.error('AI API 錯誤:', error);
                thinkingDiv.innerHTML = `${getLocalizedText('ai', 'error')}${error.message}<br>${getLocalizedText('ai', 'retry')}`;
                thinkingDiv.className = 'ai-message assistant';
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = getLocalizedText('ai', 'send');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const aiInput = document.getElementById('ai-input');
            if (aiInput) {
                aiInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendToAI();
                    }
                });
            }

            const languageSelect = document.getElementById('language-select');
            if (languageSelect) {
                languageSelect.addEventListener('change', function () {
                    applyLanguage(this.value);
                });
            }

            applyLanguage();
        });
    </script>
