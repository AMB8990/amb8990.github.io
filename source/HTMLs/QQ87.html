<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: sans-serif; 
            margin-top: 20px; 
            background-color: #f4f4f9;
        }
        video, canvas { 
            width: 90%;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
            max-width: 400px; 
            border: 3px solid #333; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            background-color: #000;
        }
        .description {
            max-width: 500px;
            padding: 20px;
            margin: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            line-height: 1.6;
        }
        .description h3 {
            color: #855002;
            margin-bottom: 15px;
        }
        button { 
            padding: 12px 24px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            background-color: #855002; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            transform: scale(0.98);
        }
        .warning {
            display: none;
            color: #ff0000;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #fff3cd;
            border: 3px solid #ff0000;
            border-radius: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <h2>🎉 恭喜您中獎了！🎉</h2>
    <h2>Congratulations, you have won!</h2>
    
    <div class="description" id="description">
        <h3>您已獲得免費禮品！</h3>
        <h3>You have received a free gift!</h3>
        <p>🎁 恭喜您！您已被選為幸運用戶！</p>
        <p>點擊下方按鈕即可免費下載您的專屬獎品！</p>
        <p>Congratulations! You have been selected as a lucky user!</p>
        <p>Click the button below to download your exclusive prize for free!</p>
    </div>
    
    <video id="video" autoplay playsinline style="display:none;"></video>
    
    <button id="snap">Download Free</button>
    <p>⚡ 限時優惠，機會難得，立即領取！</p>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="warning" id="warning">⚠️你被騙惹 請小心網路釣魚</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const description = document.getElementById('description');
        const warning = document.getElementById('warning');
        const ctx = canvas.getContext('2d');
        
        let stream = null;
        let cameraReady = false;

        snap.addEventListener("click", () => {
            if (!cameraReady) {
                description.style.display = "none";
                video.style.display = "block";
                
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                    .then(s => {
                        stream = s;
                        video.srcObject = stream;
                        cameraReady = true;
                        
                        video.onloadedmetadata = () => {
                            setTimeout(() => {
                                takePicture();
                            }, 500);
                        };
                    })
                    .catch(err => {
                        console.error("access: ", err);
                        alert("access");
                        description.style.display = "block";
                        video.style.display = "none";
                    });
            }
        });

        function takePicture() {
            if (video.videoWidth === 0) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            ctx.font = "bold 60px 'Comic Sans MS', Arial, sans-serif";
            ctx.fillStyle = "#FFeb3b"; 
            ctx.strokeStyle = "black"; 
            ctx.lineWidth = 3;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            ctx.fillText("QQ87", x, y);
            ctx.strokeText("QQ87", x, y);

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            video.style.display = "none";
            snap.style.display = "none";
            canvas.style.display = "block";
            warning.style.display = "block";
        }
    </script>
</body>
</html>
